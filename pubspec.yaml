name: neomeo
description: "너머 — 외출 전, 조용히 안심을 더해주는 인지 보조 도구"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
    
  uuid: ^4.5.1

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.5.1

  # Routing + deeplink
  go_router: ^14.2.7

  # Notifications
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4

  # Geofencing (background, Android 5.1+, successor of geofence_service)
  geofencing_api: ^2.0.0

  # Foreground service — 백그라운드에서도 프로세스를 살려 지오펜스가 동작하게 함
  flutter_foreground_task: ^8.14.0

  # Permissions
  permission_handler: ^11.3.1

  # Storage
  shared_preferences: ^2.3.2

  # Background task (midnight reset)
  workmanager: ^0.9.0+3

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.0

  # Utils
  intl: ^0.19.0
  http: ^1.6.0
  google_sign_in: ^6.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^2.0.0
  extension_google_sign_in_as_googleapis_auth: ^2.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "icon/icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: icon/icon.png
  android_12:
    color: "#FFFFFF"
    image: icon/icon.png

flutter:
  uses-material-design: true
  assets:
    - assets/
